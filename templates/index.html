<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monasteries Data Entry</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #121212;
    color: #e0e0e0;
    min-height: 80vh;
}
h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #ffffff;
}
form {
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    width: 1190px;
    max-width: 90vw;
    margin: 0 auto;
}
.form-row {
    display: flex;
    align-items: center;
    margin-top: 15px;
    flex-wrap: wrap;
}
.form-row label {
    margin-left: 50px;
    width: 480px;
    font-weight: bold;
}
.form-row input {
    width: 260px;
    padding: 5px 10px;
    margin-right: 10px;
    margin-bottom: 5px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #2a2a2a;
    color: #fff;
}
.form-row input::placeholder {
    color: #aaa;
}
.form-row button {
    padding: 5px 10px;
    margin-right: 10px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    height: 28px;
}
.form-row button:hover {
    background: #0056b3;
}
.delete-btn {
    background: #dc3545;
    margin-left: 5px;
}
.delete-btn:hover {
    background: #a71d2a;
}
.subfields {
    margin-left: 0px;
    margin-top: 10px;
}
.subfields div {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
    flex-wrap: nowrap;
    white-space: nowrap;
}
.subfields input {
    width: 100px;
    margin-right: 0px;
    margin-left: 0px;
    padding: 4px 6px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #2a2a2a;
    color: #fff;
}
.submit-btn {
    margin-top: 20px;
    padding: 10px 20px;
    width: 180px;
    font-size: 16px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    margin-left: 50px;
    cursor: pointer;
}
.submit-btn:hover {
    background: #1e7e34;
}
.dynamic-row {
    display: flex;
    align-items: center;
    margin-left: 530px;
    margin-top: 5px;
    gap: 5px;
}
</style>
</head>

<body>

<h2>Monasteries Data Entry Form</h2>
<input type="hidden" name="qid" id="qidField">
<form id="monasteriesForm">

    <div class="form-row">
        <label>Label:</label>
        <input name="L_lang[]" placeholder="Language code (e.g. en, de)">
        <input name="L_value[]" placeholder="Label value">
        <button type="button" onclick="addLangField('labels-container', 'L')">Add</button>
    </div>
    <div id="labels-container"></div>

    <div class="form-row">
        <label>Description:</label>
        <input name="D_lang[]" placeholder="Language code (e.g. en, de)">
        <input name="D_value[]" placeholder="Label value">
        <button type="button" onclick="addLangField('descriptions-container', 'D')">Add</button>
    </div>
    <div id="descriptions-container"></div>

    <div class="form-row">
        <label>Also known as / Aliases:</label>
        <input name="A_lang[]" placeholder="Language code (e.g. en, de)">
        <input name="A_value[]" placeholder="Label value">
        <button type="button" onclick="addLangField('aliases-container', 'A')">Add</button>
    </div>
    <div id="aliases-container"></div>

    <div class="form-row">
        <label>P2 – Instance of:</label>
        <input name="P2" autocomplete="off">
    </div>

    <div class="form-row">
        <label>P131 - Research projects that contributed to this data set:</label>
        <input name="P131" autocomplete="off">
    </div>

    <div class="form-row">
        <label>P208 – Address / Real estate:</label>
        <input name="P208" autocomplete="off">
        <button type="button" onclick="addField('P208_subfields', 'Qualifier')">Add Qualifier</button>
        <button type="button" onclick="addField('P208_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P208_subfields"></div>

    <div class="form-row">
        <label>P662 – Dedicatee:</label>
        <input name="P662" autocomplete="off" placeholder="Should be a String">
        <button type="button" onclick="addField('P662_subfields', 'Qualifier')">Add Qualifier</button>
        <button type="button" onclick="addField('P662_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P662_subfields"></div>

    <div class="form-row">
        <label>P746 – Religious order:</label>
        <input name="P746" autocomplete="off">
        <button type="button" onclick="addField('P746_subfields', 'Qualifier')">Add Qualifier</button>
        <button type="button" onclick="addField('P746_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P746_subfields"></div>

    <br></br>
    <h3 style="text-align: center;">Add Identifiers</h3>

    <div class="form-row">
        <label>P76 - GND:</label>
        <input name="P76" autocomplete="off">
        <button type="button" onclick="addField('P76_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P76_subfields"></div>

    <div class="form-row">
        <label>P471 - Klosterdatenbank ID:</label>
        <input name="P471" autocomplete="off">
        <button type="button" onclick="addField('P471_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P471_subfields"></div>

    <div id="statusMessage" style="
    display: none; 
    margin: 20px 50px; 
    padding: 15px; 
    border-radius: 6px; 
    text-align: center; 
    font-weight: bold;">
    </div>

    <button class="submit-btn" type="submit">Add Entry</button>
    
    <button class="submit-btn"
    type="button"
    id="complexesBtn" 
    style="
        width: 180px;
        white-space: nowrap;
        float: right;
    ">
    Complexes Form
    </button>


</form>

<h4 id="fetchMessage" style="text-align: center; margin: 20px 0;">
  To get updated data from FactGrid, please click the button below (it may take a few minutes).
</h4>
<button type="button" class="submit-btn" id="runScriptBtn" style="width: 180px; display: block; margin: 20px auto;">Run Fetch Script</button>


<script>
// Map input names to their JSON files
const autocompleteFiles = {
  /*"P208": "static/data/Q16200.json",*/
  "P131": "static/data/Q11295.json",
  "P2": "static/data/Q704192.json",
  "P746": "static/data/Q141469.json"
};

// Store loaded JSONs
const autocompleteData = {};

// Load all JSONs at start
for (const [field, file] of Object.entries(autocompleteFiles)) {
  fetch(file)
    .then(res => res.json())
    .then(data => {
      autocompleteData[field] = data; 
    })
    .catch(err => console.error(`Error loading ${file}:`, err));
}

function showStatus(message, isError = false) {
    const statusDiv = document.getElementById("statusMessage");
    statusDiv.textContent = message;
    statusDiv.style.display = "block";
    
    // Green for success, Red for error
    statusDiv.style.background = isError ? "#dc3545" : "#28a745";
    statusDiv.style.color = "white";

    // Optional: Auto-hide after 10 seconds
    setTimeout(() => {
        statusDiv.style.display = "none";
    }, 10000);
}

// Attach autocomplete to input
function attachLocalAutocomplete(input, fieldName) {
    const dropdown = document.createElement("div");
    dropdown.style.position = "absolute";
    dropdown.style.background = "#2a2a2a";
    dropdown.style.color = "#fff";
    dropdown.style.border = "1px solid #444";
    dropdown.style.zIndex = "1000";
    dropdown.style.display = "none";
    document.body.appendChild(dropdown);

    input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        if (!q || !autocompleteData[fieldName]) {
            dropdown.style.display = "none";
            return;
        }

        const results = autocompleteData[fieldName]
            .filter(([qid, name]) => name.toLowerCase().includes(q))
            .slice(0, 5);

        dropdown.innerHTML = "";
        results.forEach(([qid, name]) => {
            const opt = document.createElement("div");
            opt.textContent = `${name} (${qid})`;
            opt.style.padding = "5px 10px";
            opt.style.cursor = "pointer";
            opt.onclick = () => {
                input.value = qid; // only QID in input
                dropdown.style.display = "none";
            };
            dropdown.appendChild(opt);
        });

        if (results.length) {
            const rect = input.getBoundingClientRect();
            dropdown.style.top = rect.bottom + window.scrollY + "px";
            dropdown.style.left = rect.left + window.scrollX + "px";
            dropdown.style.minWidth = rect.width + "px";
            dropdown.style.display = "block";
        } else {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("click", e => {
        if (e.target !== input) dropdown.style.display = "none";
    });
}

// Apply to your inputs
document.querySelectorAll('input[name="P131"], input[name="P2"], input[name="P746"]') /*', input[name="P208"]')*/
    .forEach(input => {
        const fieldName = input.getAttribute("name");
        attachLocalAutocomplete(input, fieldName);
    });


const btn = document.getElementById('runScriptBtn');
const msg = document.getElementById('fetchMessage');

btn.addEventListener('click', () => {
    msg.textContent = "Fetching data... please wait ⏳";
    btn.disabled = true; // prevent multiple clicks

    fetch('/run-fetch-script')
      .then(response => response.json())
      .then(data => {
          if (data.error) {
              msg.textContent = "Error: " + data.error;
              console.error(data.stderr);
          } else {
              msg.textContent = "Done ✅";
              console.log(data.stdout);
          }
      })
      .catch(err => {
          msg.textContent = "An error occurred.";
          console.error(err);
      })
      .finally(() => {
          btn.disabled = false;
      });
});

document.getElementById("runScriptBtn").addEventListener("click", async () => {
    try {
        const res = await fetch("/run-fetch-script");
        const data = await res.json();
        console.log("Script stdout:", data.stdout);
        console.log("Script stderr:", data.stderr);
        alert("Script finished! Check console for output.");
    } catch (err) {
        console.error(err);
        alert("Error running script.");
    }
});

let qualifierOptions = [];

fetch('/static/data/dates.json')
  .then(res => res.json())
  .then(data => {
      qualifierOptions = data.sort((a, b) => {
          const numA = parseInt(a[0].replace('P',''));
          const numB = parseInt(b[0].replace('P',''));
          return numA - numB;
      });
  })
  .catch(err => console.error(err));

function createQualifierInput(rowDiv, containerId, pid) {

    // Remove old qualifier boxes first
    rowDiv.querySelectorAll(".qual-extra").forEach(el => {
        if (!el.classList.contains("delete-btn")) {
            el.remove();
        }
    });

    let html = "";

    // If PID is P49 or P50 → date box
    if (pid === "P49" || pid === "P50") {

        html = `
        <div class="qual-extra" style="display:flex; align-items:center; gap:6px; margin-left:10px;">
            Enter Date:
            <input type="date" name="${containerId}_begin[]" class="qual-input">
        </div>
        `;

    } else {

        html = `
        <input type="text"
               name="${containerId}_ref[]"
               placeholder="Qualifier value"
               class="qual-extra qual-input"
               style="width:200px;">
        `;
    }

    rowDiv.insertAdjacentHTML("beforeend", html);
}

function addField(containerId, type) {
    const container = document.getElementById(containerId);
    const div = document.createElement('div');
    div.className = 'dynamic-row';

    if (type === 'Qualifier') {
        const selectBtn = document.createElement('button');
        selectBtn.type = 'button';
        selectBtn.textContent = 'Select Qualifier';
        selectBtn.style.background = '#ffffff'; // white background
        selectBtn.style.color = '#000';         // black text
        selectBtn.style.border = '1px solid #444';
        selectBtn.style.borderRadius = '0';
        selectBtn.style.cursor = 'pointer';
        selectBtn.style.width = '188px';

        const pidInput = document.createElement('input');
        pidInput.type = 'hidden';
        pidInput.name = `${containerId}_pid[]`;

        const dropdown = document.createElement('div');
        dropdown.style.position = 'absolute';
        dropdown.style.background = '#ffffff'; // white background
        dropdown.style.color = '#000';         // black text
        dropdown.style.border = '1px solid #444';
        dropdown.style.maxHeight = '200px';
        dropdown.style.overflowY = 'auto';
        dropdown.style.padding = '5px';
        dropdown.style.display = 'none';
        dropdown.style.zIndex = '1000';
        document.body.appendChild(dropdown);

        function populateDropdown() {
            dropdown.innerHTML = '';
            qualifierOptions.forEach(opt => {
                const pid = opt[0];
                const label = opt[1] || '';
                const desc = opt[2] || '';
                const optionDiv = document.createElement('div');
                optionDiv.style.padding = '5px';
                optionDiv.style.cursor = 'pointer';
                optionDiv.style.borderBottom = '1px solid #ccc';
                optionDiv.style.fontWeight = 'normal'; // normal text
                optionDiv.innerHTML = `${pid} - ${label}<br><small>${desc}</small>`;
                optionDiv.onclick = () => {
                    pidInput.value = pid;

                    // Clear row content except delete button
                    const existingInputs = div.querySelectorAll(".qual-input");
                    existingInputs.forEach(el => el.remove());

                    selectBtn.textContent = `${pid} - ${label}`;
                    dropdown.style.display = 'none';

                    createQualifierInput(div, containerId, pid);
                };
                dropdown.appendChild(optionDiv);
            });
        }

        selectBtn.onclick = () => {
            if (!qualifierOptions.length) {
                alert("Data not loaded yet, try again in a moment.");
                return;
            }
            populateDropdown();
            const rect = selectBtn.getBoundingClientRect();
            dropdown.style.top = rect.bottom + window.scrollY + 'px';
            dropdown.style.left = rect.left + window.scrollX + 'px';
            dropdown.style.minWidth = rect.width + 'px';
            dropdown.style.display = 'block';
        };

        document.addEventListener('click', e => {
            if (e.target !== selectBtn) dropdown.style.display = 'none';
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = () => div.remove();

        div.appendChild(selectBtn);
        div.appendChild(pidInput);
        div.appendChild(deleteBtn);

    } else {
        div.innerHTML = `<select name="${containerId}_pid[]">
                            <option value="P471">P471 – Klosterdatenbank ID</option>
                            <option value="P146">P146 – Online Information</option>
                         </select>
                         <input type="text" name="${containerId}_ref[]">
                         <button type="button" class="delete-btn" onclick="this.parentNode.remove()">Remove</button>`;
    }

    container.appendChild(div);
}

function addLangField(containerId, type) {
    const container = document.getElementById(containerId);
    const div = document.createElement('div');
    div.className = 'dynamic-row';
    div.innerHTML = `<input name="${type}_lang[]" placeholder="Language code">
                     <input name="${type}_value[]" placeholder="Value">
                     <button type="button" class="delete-btn" onclick="this.parentNode.remove()">Delete</button>`;
    container.appendChild(div);
}

document.getElementById("complexesBtn").addEventListener("click", function() {
    // Get the QID we stored during the "Save V1 Command" submit
    const lastQid = localStorage.getItem("last_monastery_qid");
    
    let targetUrl = "{{ url_for('complexes') }}";
    
    if (lastQid) {
        // Append the QID as a URL parameter
        targetUrl += `?monastery_qid=${lastQid}`;
    }
    
    window.location.href = targetUrl;
});

/* ===============================
   Helper: Build Qualifier/Reference Parts
   =============================== */
const buildQualifierParts = (field) => {
    const sub = field + "_subfields";
    const rows = document.querySelectorAll(`#${sub} .dynamic-row`);
    const parts = [];

    const fmt = d => d ? `+${d}T00:00:00Z/11` : "";

    rows.forEach(row => {
        // Find the PID source (input for Qualifiers, select for References)
        const pidSource = row.querySelector(`input[name="${sub}_pid[]"], select[name="${sub}_pid[]"]`);
        if (!pidSource) return;

        const pid = pidSource.value.trim();
        if (!pid) return;

        // Identify the value type
        const dateInput = row.querySelector("input[type='date']");
        const textInput = row.querySelector("input[type='text']:not(.qual-extra)"); // References
        const qualTextInput = row.querySelector("input.qual-extra"); // Qualifiers

        let value = "";
        if (dateInput && dateInput.value) {
            value = fmt(dateInput.value);
        } else if (qualTextInput && qualTextInput.value) {
            value = qualTextInput.value.trim();
        } else if (textInput && textInput.value) {
            value = textInput.value.trim();
            if (pid === "P146") value = `"${value}"`; 
        }

        if (value) {
            // If it's a reference (from a select), some V1 formats use 'S' prefix
            // If you just want standard V1, keep it as 'pid'
            parts.push(`${pid} ${value}`);
        }
    });

    return parts.join("  ");
};


document.getElementById("monasteriesForm").onsubmit = async e => {
    e.preventDefault();

    const fd = new FormData(e.target);
    const fields = ["P131", "P2", "P746", "P662", "P208", "P471", "P76"];
    
    // 1. REUSE OR GENERATE QID
    let qid = localStorage.getItem("pending_monastery_qid");

    try {
        if (!qid) {
            const res = await fetch("/create-empty-item", {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            });
            if (!res.ok) throw new Error("Failed to reach server to create QID.");
            const result = await res.json();
            qid = result.id;
            localStorage.setItem("pending_monastery_qid", qid);
        }

        /* ===============================
            2. Build Monastery V1 Command
        =============================== */
        const data = {};
        fields.forEach(field => {
            let value = fd.get(field);
            if (!value) return;
            if (field === "P662") value = `"${value}"`;
            const qualifiers = buildQualifierParts(field);
            data[field] = qualifiers ? `${value} ${qualifiers}` : value;
        });

        ["L", "D", "A"].forEach(prefix => {
            const langs = fd.getAll(`${prefix}_lang[]`);
            const vals = fd.getAll(`${prefix}_value[]`);
            langs.forEach((lang, i) => {
                if (!lang || !vals[i]) return;
                const key = `${prefix}${lang.trim()}`;
                if (!data[key]) data[key] = [];
                data[key].push(`"${vals[i]}"`);
            });
        });

        let command = "";
        Object.entries(data).forEach(([k, v]) => {
            if (Array.isArray(v)) {
                v.forEach(x => { command += `${qid}\t${k}\t${x}\n`; });
            } else {
                command += `${qid}\t${k}\t${v}\n`;
            }
        });

        if (!command) throw new Error("No data provided.");

        /* ===============================
            3. PASS TO COMPLEX FORM
        =============================== */
        // We store the V1 command string in localStorage
        localStorage.setItem("pending_monastery_v1", command);
        
        // Also update the 'last' QID for the navigation button
        localStorage.setItem("last_monastery_qid", qid);

        /* COMMENTED OUT DATA SUBMISSION
           ----------------------------------
           const saveRes = await fetch("/save-data", { ... });
        */

        console.log("Monastery V1 Command Prepared and Saved:", command);
        showStatus(`Success! Monastery data for ${qid} is ready. Please click 'Complexes Form' to proceed.`);

    } catch (err) {
        console.error("Critical Failure:", err.message);
        showStatus(`Error: ${err.message}`, true);
    }
};
