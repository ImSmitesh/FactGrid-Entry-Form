<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monasteries Data Entry</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #121212;
  color: #e0e0e0;
  min-height: 80vh;
}

h2 {
  text-align: center; /* top center horizontally */
  margin-bottom: 20px;
  color: #ffffff;
}

form {
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  width: 670px;
  max-width: 90vw;
  margin: 0 auto; /* center horizontally */
}

.form-row {
  display: flex;
  align-items: center;
  margin-top: 15px;
}

.form-row label {
  width: 250px;
  font-weight: bold;
}

.form-row input {
  width: 260px;
  padding: 5px 8px;
  margin-right: 10px;
  border: 1px solid #444;
  border-radius: 4px;
  background: #2a2a2a;
  color: #fff;
}

.form-row input::placeholder {
  color: #aaa;
}

.form-row button {
  width: 120px;
  padding: 5px 10px;
  margin-right: 5px;
  border: none;
  background: #007bff;
  color: white;
  border-radius: 4px;
  cursor: pointer;
}

.form-row button:hover {
  background: #0056b3;
}

.subfields {
  margin-left: 250px; /* aligns with input field */
  margin-top: 10px;
}

.subfields div {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
  flex-wrap: nowrap;
  white-space: nowrap;   /* prevents text from wrapping */
}

.subfields input {
  width: 100px;
  margin-right: 10px;
  padding: 4px 6px;
  border: 1px solid #444;
  border-radius: 4px;
  background: #2a2a2a;
  color: #fff;
}

.remove-btn {
  background: #dc3545;
  margin-left: 5px;
  padding: 4px 8px;
}

.remove-btn:hover {
  background: #a71d2a;
}

.submit-btn {
  margin-top: 20px;
  padding: 10px 20px;
  width: 150px;
  font-size: 16px;
  background: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.submit-btn:hover {
  background: #1e7e34;
}


</style>
</head>

<body>

<h2>Complexes Data Entry Form</h2>

<form id="complexesForm">

    <div class="form-row">
        <label>P2 - Instance of:</label>
        <input name="P2_complex" value="Q635758" readonly>
    </div>

    <div class="form-row" style="align-items: flex-start;">
    <label style="margin-top: 8px;">P48 - Coordinate location:</label>
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <input id="lat_input" type="text" step="any" placeholder="Latitude (e.g. 52.12345)">
        <input id="long_input" type="text" step="any" placeholder="Longitude (e.g. 9.12345)">
    </div>
    </div>

    <div class="form-row">
        <label>P83 - Place of address:</label>
        <input name="P83" autocomplete="off">
    </div>

    <!-- <div class="form-row">
        <label>P131 - Research projects:</label>
        <input name="P131" autocomplete="off">
        <button type="button" onclick="addField('P131_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P131_subfields"></div> -->

    <div class="form-row">
        <label>P1003 - Diocese:</label>
        <input name="P1003" autocomplete="off">
        <button type="button" onclick="addField('P1003_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P1003_subfields"></div>

    <div class="form-row">
        <label>P1095 - Users:</label>
        <input name="P1095" autocomplete="off">
        <button type="button" onclick="addField('P1095_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P1095_subfields"></div>

    <br></br>
    <h3 style="text-align: center;">Add Identifiers</h3>

    <div class="form-row">
        <label>P76 - GND:</label>
        <input name="P76" autocomplete="off">
        <button type="button" onclick="addField('P76_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P76_subfields"></div>

    <div class="form-row">
        <label>P471 - Klosterdatenbank ID:</label>
        <input name="P471" autocomplete="off">
        <button type="button" onclick="addField('P471_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P471_subfields"></div>

<!-- <button type="submit" class="submit-btn"
style="
      width: 180px;
      white-space: nowrap;
">
Add Entry</button> -->

<div style="display: flex; gap: 15px; margin-top: 20px; justify-content: center;">
    <button type="submit" class="submit-btn" style="width: 220px; background: #28a745;">
        Download Batch
    </button>
</div>

</form>

<script>


// Map input names to their JSON files
const autocompleteFiles = {
  "P83": "static/data/Q8.json",
  "P1003": "static/data/Q153166.json",
  /*"P131": "static/data/Q11295.json",*/
};

// Store loaded JSONs
const autocompleteData = {};

// Load all JSONs at start
for (const [field, file] of Object.entries(autocompleteFiles)) {
  fetch(file)
    .then(res => res.json())
    .then(data => {
      autocompleteData[field] = data; // data should be array of [QID, Name]
    })
    .catch(err => console.error(`Error loading ${file}:`, err));
}

// Attach autocomplete to input
function attachLocalAutocomplete(input, fieldName) {
    const dropdown = document.createElement("div");
    dropdown.style.position = "absolute";
    dropdown.style.background = "#2a2a2a";
    dropdown.style.color = "#fff";
    dropdown.style.border = "1px solid #444";
    dropdown.style.zIndex = "1000";
    dropdown.style.display = "none";
    document.body.appendChild(dropdown);

    input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        if (!q || !autocompleteData[fieldName]) {
            dropdown.style.display = "none";
            return;
        }

        const results = autocompleteData[fieldName]
            .filter(([qid, name]) => name.toLowerCase().includes(q))
            .slice(0, 5);

        dropdown.innerHTML = "";
        results.forEach(([qid, name]) => {
            const opt = document.createElement("div");
            opt.textContent = `${name} (${qid})`;
            opt.style.padding = "5px 10px";
            opt.style.cursor = "pointer";
            opt.onclick = () => {
                input.value = qid; // only QID in input
                dropdown.style.display = "none";
            };
            dropdown.appendChild(opt);
        });

        if (results.length) {
            const rect = input.getBoundingClientRect();
            dropdown.style.top = rect.bottom + window.scrollY + "px";
            dropdown.style.left = rect.left + window.scrollX + "px";
            dropdown.style.minWidth = rect.width + "px";
            dropdown.style.display = "block";
        } else {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("click", e => {
        if (e.target !== input) dropdown.style.display = "none";
    });
}

// Apply to your inputs
document.querySelectorAll('input[name="P83"], input[name="P1003"]')/*input[name="P131"]*/
    .forEach(input => {
        const fieldName = input.getAttribute("name");
        attachLocalAutocomplete(input, fieldName);
    });



function addField(containerId, type) {
  const container = document.getElementById(containerId);
  const div = document.createElement('div');

  if (type === 'Qualifier') {
    div.innerHTML = `
      Begin Date: <input type="date" name="${containerId}_begin[]">
      End Date: <input type="date" name="${containerId}_end[]">
      <button type="button" class="remove-btn" onclick="this.parentNode.remove()">Remove</button>
    `;
  } else {
    div.innerHTML = `
      <select name="${containerId}_pid[]">
        <option value="P471">P471 – Klosterdatenbank ID</option>
        <option value="P146">P146 – Online Information</option>
      </select>
      <input type="text" name="${containerId}_ref[]">
      <button type="button" class="remove-btn" onclick="this.parentNode.remove()">Remove</button>
    `;
  }

  container.appendChild(div);
}

// Variable to hold the QID throughout the session
let monasteryQid = null;

function downloadBatch(content, filename) {
    const blob = new Blob([content], { type: 'text/plain' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);
}

const PID_TYPES = {
TIME: ["P1079", "P49", "P571", "P580", "P1124", "P1126", "P39", "P1060", "P779", "P106", "P585", "P41", "P43", "P1319", "P96", "P1326", "P1371", "P37", "P1636", "P77", "P569", "P40", "P4602", "P182", "P321", "P38", "P570", "P303", "P575", "P394", "P432", "P813", "P412", "P214", "P551", "P222", "P577", "P44", "P459", "P50", "P576", "P582", "P1123", "P1125", "P46", "P290", "P1249", "P289", "P291", "P2032", "P612", "P818", "P45"],
STRING: ["P112", "P88", "P787", "P788", "P509", "P146", "P471", "P76"],
ITEM: ["P506", "P854", "P510", "P853", "P2348", "P785", "P467", "P786"]
};

// Function used inside your submission loop
function formatValueByPid(pid, val) {
    if (!val) return "";
    val = val.trim();

    if (PID_TYPES.TIME.includes(pid)) {
        // Extract the year from the YYYY-MM-DD string
        const yearMatch = val.match(/^(\d{4})/);
        const year = yearMatch ? parseInt(yearMatch[1]) : null;

        // Base format: +YYYY-MM-DDT00:00:00Z/11
        let formattedDate = `+${val}T00:00:00Z/11`;

        // If the year is 1582 or earlier, append /J for Julian Calendar
        if (year !== null && year <= 1582) {
            formattedDate += "/J";
        }

        return formattedDate;
    } 
    else if (PID_TYPES.STRING.includes(pid)) {
        return `"${val}"`;
    } 
    else {
        // Items (QIDs)
        return val;
    }
}

document.getElementById("complexesForm").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);

    let qid_of_complex = "";

    try {
        // // 1. ALWAYS Generate a fresh Complex QID via API
        // const res = await fetch("/create-empty-item", {
        //     method: "POST",
        //     headers: { "Content-Type": "application/json" }
        // });
        
        // if (!res.ok) throw new Error("Failed to reach server to create Complex QID.");
        // const result = await res.json();
        
        // if (!result.id) throw new Error("API failed to return a valid QID for the Complex.");
        // qid_of_complex = result.id;
        qid_of_complex = 2

        // 2. Build Complex V1 Section
        let complexV1 = "";
        const properties = ["P2_complex", "P48_complex", "P83", "P1003", "P1095", "P76", "P471"]; /*"P131"*/
        
        properties.forEach(prop => {
            const cleanProp = prop.replace("_complex", "");
            let val;

            if (prop === "P48_complex") {
                const lat = document.getElementById("lat_input").value.trim();
                const long = document.getElementById("long_input").value.trim();
                val = (lat && long) ? `@${lat}/${long}` : null;
            } else {
                // Formatter handles P471/P76 quotes and Date logic
                val = formatValueByPid(cleanProp, fd.get(prop));
            }

            if (!val) return;

            let line = `${qid_of_complex}\t${cleanProp}\t${val}`;

            // Handle Qualifiers and References (Subfields)
            const subContainerId = prop + "_subfields";
            const pidArr = fd.getAll(`${subContainerId}_pid[]`);
            const refArr = fd.getAll(`${subContainerId}_ref[]`);

            pidArr.forEach((pid, i) => {
                let rawRefValue = refArr[i];
                if (rawRefValue) {
                    let formattedRefValue = formatValueByPid(pid, rawRefValue);
                    line += `\t${pid}\t${formattedRefValue}`;
                }
            });

            complexV1 += line + "\n";
        });

        // 3. Retrieve Monastery V1 and QID from previous form
        const monasteryV1 = localStorage.getItem("pending_monastery_v1") || "";
        const monasteryQid = localStorage.getItem("last_monastery_qid");
        
        // 4. Create the Inter-Links
        let links = "";
        if (monasteryQid && qid_of_complex) {
            // Monastery points to Complex (P208)
            links += `${monasteryQid}\tP208\t${qid_of_complex}\n`;
            // Complex points back to Monastery (P131)
            links += `${qid_of_complex}\tP131\t${monasteryQid}\n`;
        }

        // 5. Combine everything
        const finalBatch = monasteryV1 + 
                           "\n" + complexV1 + 
                           "\n" + links;

        // 6. Trigger Download
        const fileName = `factgrid_batch_${monasteryQid || 'item'}.txt`;
        downloadBatch(finalBatch, fileName);

        // 7. Cleanup Memory
        localStorage.removeItem("pending_complex_qid");
        localStorage.removeItem("pending_monastery_qid");
        localStorage.removeItem("pending_monastery_v1");
        localStorage.removeItem("last_monastery_qid");

        alert(`Batch file generated with fresh IDs: Monastery (${monasteryQid}) and Complex (${qid_of_complex})!`);

    } catch (err) {
        alert("Error: " + err.message);
    }
};
</script>

</body>
</html>
