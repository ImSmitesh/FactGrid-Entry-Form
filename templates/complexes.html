<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monasteries Data Entry</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #121212;
  color: #e0e0e0;
  min-height: 80vh;
}

h2 {
  text-align: center; /* top center horizontally */
  margin-bottom: 20px;
  color: #ffffff;
}


.form-container {
  display: flex;
  justify-content: center; /* horizontally center the form */
}

form {
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  width: 670px;
  max-width: 90vw;
  margin: 0 auto; /* center horizontally */
}

.form-row {
  display: flex;
  align-items: center;
  margin-top: 15px;
}

.form-row label {
  width: 250px;
  font-weight: bold;
}

.form-row input {
  width: 260px;
  padding: 5px 8px;
  margin-right: 10px;
  border: 1px solid #444;
  border-radius: 4px;
  background: #2a2a2a;
  color: #fff;
}

.form-row input::placeholder {
  color: #aaa;
}

.form-row button {
  width: 120px;
  padding: 5px 10px;
  margin-right: 5px;
  border: none;
  background: #007bff;
  color: white;
  border-radius: 4px;
  cursor: pointer;
}

.form-row button:hover {
  background: #0056b3;
}

.subfields {
  margin-left: 250px; /* aligns with input field */
  margin-top: 10px;
}

.subfields div {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
  flex-wrap: nowrap;
  white-space: nowrap;   /* prevents text from wrapping */
}

.subfields input {
  width: 100px;
  margin-right: 10px;
  padding: 4px 6px;
  border: 1px solid #444;
  border-radius: 4px;
  background: #2a2a2a;
  color: #fff;
}

.remove-btn {
  background: #dc3545;
  margin-left: 5px;
  padding: 4px 8px;
}

.remove-btn:hover {
  background: #a71d2a;
}

.submit-btn {
  margin-top: 20px;
  padding: 10px 20px;
  width: 150px;
  font-size: 16px;
  background: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.submit-btn:hover {
  background: #1e7e34;
}


</style>
</head>

<body>

<h2>Complexes Data Entry Form</h2>

<form id="complexesForm">

    <div class="form-row">
        <label>P2 - Instance of:</label>
        <input name="P2_complex" value="Building Complex" readonly>
    </div>

    <div class="form-row">
        <label>P48 - Coordinate location:</label>
        <input name="P48_complex" type="text" autocomplete="off" placeholder="@Lat./Long. (e.g. @52.12345/9.12345)">
    </div>

    <div class="form-row">
        <label>P83 - Place of address:</label>
        <input name="P83" autocomplete="off">
    </div>

    <div class="form-row">
        <label>P131 - Research projects:</label>
        <input name="P131" autocomplete="off">
        <button type="button" onclick="addField('P131_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P131_subfields"></div>

    <div class="form-row">
        <label>P1003 - Diocese:</label>
        <input name="P1003" autocomplete="off">
        <button type="button" onclick="addField('P1003_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P1003_subfields"></div>

    <div class="form-row">
        <label>P1095 - Users:</label>
        <input name="P1095" autocomplete="off">
        <button type="button" onclick="addField('P1095_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P1095_subfields"></div>

    <br></br>
    <h3 style="text-align: center;">Add Identifiers</h3>

    <div class="form-row">
        <label>P76 - GND:</label>
        <input name="P76" autocomplete="off">
        <button type="button" onclick="addField('P76_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P76_subfields"></div>

    <div class="form-row">
        <label>P471 - Klosterdatenbank ID:</label>
        <input name="P471" autocomplete="off">
        <button type="button" onclick="addField('P471_subfields', 'Reference')">Add Reference</button>
    </div>
    <div class="subfields" id="P471_subfields"></div>

<button type="submit" class="submit-btn"
style="
      width: 180px;
      white-space: nowrap;
">
Add Entry</button>

</form>

<script>


// Map input names to their JSON files
const autocompleteFiles = {
  "P83": "static/data/Q8.json",
  "P1003": "static/data/Q153166.json",
  "P131": "static/data/Q11295.json",
};

// Store loaded JSONs
const autocompleteData = {};

// Load all JSONs at start
for (const [field, file] of Object.entries(autocompleteFiles)) {
  fetch(file)
    .then(res => res.json())
    .then(data => {
      autocompleteData[field] = data; // data should be array of [QID, Name]
    })
    .catch(err => console.error(`Error loading ${file}:`, err));
}

// Attach autocomplete to input
function attachLocalAutocomplete(input, fieldName) {
    const dropdown = document.createElement("div");
    dropdown.style.position = "absolute";
    dropdown.style.background = "#2a2a2a";
    dropdown.style.color = "#fff";
    dropdown.style.border = "1px solid #444";
    dropdown.style.zIndex = "1000";
    dropdown.style.display = "none";
    document.body.appendChild(dropdown);

    input.addEventListener("input", () => {
        const q = input.value.trim().toLowerCase();
        if (!q || !autocompleteData[fieldName]) {
            dropdown.style.display = "none";
            return;
        }

        const results = autocompleteData[fieldName]
            .filter(([qid, name]) => name.toLowerCase().includes(q))
            .slice(0, 5);

        dropdown.innerHTML = "";
        results.forEach(([qid, name]) => {
            const opt = document.createElement("div");
            opt.textContent = `${name} (${qid})`;
            opt.style.padding = "5px 10px";
            opt.style.cursor = "pointer";
            opt.onclick = () => {
                input.value = qid; // only QID in input
                dropdown.style.display = "none";
            };
            dropdown.appendChild(opt);
        });

        if (results.length) {
            const rect = input.getBoundingClientRect();
            dropdown.style.top = rect.bottom + window.scrollY + "px";
            dropdown.style.left = rect.left + window.scrollX + "px";
            dropdown.style.minWidth = rect.width + "px";
            dropdown.style.display = "block";
        } else {
            dropdown.style.display = "none";
        }
    });

    document.addEventListener("click", e => {
        if (e.target !== input) dropdown.style.display = "none";
    });
}

// Apply to your inputs
document.querySelectorAll('input[name="P131"], input[name="P83"], input[name="P1003"]')
    .forEach(input => {
        const fieldName = input.getAttribute("name");
        attachLocalAutocomplete(input, fieldName);
    });



function addField(containerId, type) {
  const container = document.getElementById(containerId);
  const div = document.createElement('div');

  if (type === 'Qualifier') {
    div.innerHTML = `
      Begin Date: <input type="date" name="${containerId}_begin[]">
      End Date: <input type="date" name="${containerId}_end[]">
      <button type="button" class="remove-btn" onclick="this.parentNode.remove()">Remove</button>
    `;
  } else {
    div.innerHTML = `
      <select name="${containerId}_pid[]">
        <option value="P471">P471 – Klosterdatenbank ID</option>
        <option value="P146">P146 – Online Information</option>
      </select>
      <input type="text" name="${containerId}_ref[]">
      <button type="button" class="remove-btn" onclick="this.parentNode.remove()">Remove</button>
    `;
  }

  container.appendChild(div);
}

function collectFormData(form) {
  const fd = new FormData(form);
  const data = {};
  for (const [k, v] of fd.entries()) {
    if (k.endsWith("[]")) {
      const key = k.replace("[]", "");
      if (!data[key]) data[key] = [];
      data[key].push(v);
    } else {
      data[k] = v;
    }
  }
  return data;
}

// Variable to hold the QID throughout the session
let monasteryQid = null;

document.addEventListener("DOMContentLoaded", () => {
    // 1. Extract the QID from the URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const passedQid = urlParams.get('monastery_qid');

    // 2. Assign to variable and print to console
    if (passedQid) {
        monasteryQid = passedQid;
        
        console.log("%c >>> MONASTERY QID RECEIVED <<< ", "background: #28a745; color: #fff; font-weight: bold;");
        console.log("Variable 'monasteryQid' is now set to:", monasteryQid);
    } else {
        console.log("Notice: No Monastery QID was passed to this form.");
    }
});

document.getElementById("complexesForm").onsubmit = async e => {
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);

    /* ===============================
       1. Setup & Persistent QID Check
    =============================== */
    const testMode = true; 
    // Check if we have a QID from a previously failed attempt on this page
    let qid_of_complex = localStorage.getItem("pending_complex_qid");

    try {
        // 2. GENERATE NEW ONLY IF NO PENDING QID EXISTS
        if (!qid_of_complex) {
            if (testMode) {
                qid_of_complex = "TEST_COMPLEX_" + Date.now();
            } else {
                const res = await fetch("/create-empty-item", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                if (!res.ok) throw new Error("Server failed to create complex item.");

                const result = await res.json();
                if (!result.id) throw new Error("API returned no QID for complex.");
                
                qid_of_complex = result.id;
            }
            // Store it immediately to prevent junk creation if data build fails
            localStorage.setItem("pending_complex_qid", qid_of_complex);
            console.log("New Complex QID generated and locked:", qid_of_complex);
        } else {
            console.log("Re-using pending Complex QID:", qid_of_complex);
        }

        /* ===============================
           3. Command Builder (V1 Format)
        =============================== */
        let v1 = "";
        const properties = ["P2_complex", "P48_complex", "P83", "P131", "P1003", "P1095", "P76", "P471"];

        properties.forEach(prop => {
            const val = fd.get(prop);
            if (!val) return;

            const cleanProp = prop.replace("_complex", "");
            let line = `${qid_of_complex}\t${cleanProp}\t${val}`;

            const pidArr = fd.getAll(prop + "_subfields_pid[]");
            const refArr = fd.getAll(prop + "_subfields_ref[]");
            pidArr.forEach((pid, i) => {
                if (refArr[i]) {
                    const s_pid = pid.replace("P", "S");
                    line += `\t${s_pid}\t${refArr[i]}`;
                }
            });

            v1 += line + "\n";
        });

        /* ===============================
           4. TWO-WAY LINKS
        =============================== */
        if (monasteryQid) {
            v1 += `${monasteryQid}\tP208\t${qid_of_complex}\n`;
            v1 += `${qid_of_complex}\tP1003\t${monasteryQid}\n`;
        } else {
            // Optional: prevent submission if the monastery link is required
            // throw new Error("Missing Monastery QID. Link cannot be established.");
        }

        /* ===============================
           5. FINAL EXECUTION COMMIT
        =============================== */
        // Simulate or perform API data submission
        console.log("%c >>> FINAL V1 COMMAND GENERATED <<< ", "background: #007bff; color: #fff; font-weight: bold;");
        console.log(v1);

        // --- If using API to save data ---
        // const saveRes = await fetch("/save-complex-data", { method: "POST", body: JSON.stringify({ v1 }) });
        // if (!saveRes.ok) throw new Error("Data submission failed.");

        // If we reach here, everything is successful.
        // Clear the pending QID so the next NEW complex gets a new ID.
        localStorage.removeItem("pending_complex_qid");
        
        // Also clear the monasteryQid from storage if this was a one-to-one relationship
        // localStorage.removeItem("last_monastery_qid");

        alert(`Success! Complex ${qid_of_complex} created and linked.`);

    } catch (err) {
        // If it fails, the qid_of_complex remains in 'pending_complex_qid'
        // Next click uses the SAME ID.
        console.error("Complex Execution Failed:", err.message);
        alert(`Error: ${err.message}. QID ${qid_of_complex} retained for retry.`);
    }
};

</script>

</body>
</html>
